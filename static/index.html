<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #f3f4f6;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 18% 12%, rgb(99 102 241 / 18%), transparent 38%),
        radial-gradient(ellipse at 85% 90%, rgb(14 165 233 / 12%), transparent 34%),
        #0b1020;
    }

    main {
      width: min(100%, 440px);
      padding: 32px;
      border: 1px solid rgb(255 255 255 / 9%);
      border-radius: 28px;
      background: rgb(17 24 39 / 88%);
      box-shadow: 0 28px 80px rgb(0 0 0 / 42%);
      backdrop-filter: blur(18px);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #a5b4fc;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: 1.8rem; letter-spacing: -0.04em; }
    .intro { margin: 8px 0 28px; color: #9ca3af; font-size: 0.95rem; }

    form { display: grid; gap: 18px; }

    label {
      display: grid;
      gap: 8px;
      color: #d1d5db;
      font-size: 0.85rem;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      min-height: 52px;
      padding: 0 15px;
      border: 1px solid #374151;
      border-radius: 13px;
      outline: none;
      background: #0b1020;
      color: #f9fafb;
      font: inherit;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    input:focus, select:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgb(129 140 248 / 18%);
    }

    button {
      min-height: 54px;
      margin-top: 4px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(110deg, #818cf8, #6366f1);
      color: white;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      box-shadow: 0 10px 24px rgb(99 102 241 / 25%);
      transition: filter 150ms ease, transform 150ms ease;
    }

    button:hover { filter: brightness(1.08); transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { cursor: wait; opacity: 0.7; }

    .result {
      min-height: 108px;
      margin-top: 24px;
      padding: 18px;
      border: 1px solid rgb(255 255 255 / 7%);
      border-radius: 16px;
      background: rgb(255 255 255 / 3%);
    }

    .result-label { margin: 0 0 8px; color: #9ca3af; font-size: 0.78rem; }
    output { display: block; overflow-wrap: anywhere; font-size: 1.7rem; font-weight: 700; }
    output.error { color: #fca5a5; font-size: 0.95rem; font-weight: 500; }

    @media (max-width: 480px) {
      main { padding: 25px 20px; border-radius: 22px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Quick calculations</p>
    <h1>Calculator</h1>
    <p class="intro">A clean, simple way to work it out.</p>

    <form id="calculator-form">
      <label for="number-a">
        First number
        <input id="number-a" name="a" type="number" step="any" placeholder="e.g. 24" required>
      </label>
      <label for="operation">
        Operation
        <select id="operation" name="operation">
          <option value="add">Add (+)</option>
          <option value="subtract">Subtract (−)</option>
          <option value="multiply">Multiply (×)</option>
          <option value="divide">Divide (÷)</option>
        </select>
      </label>
      <label for="number-b">
        Second number
        <input id="number-b" name="b" type="number" step="any" placeholder="e.g. 6" required>
      </label>
      <button id="calculate-button" type="submit">Calculate</button>
    </form>

    <section class="result" aria-live="polite">
      <p class="result-label">Result</p>
      <output id="result">Your answer will appear here</output>
    </section>
  </main>

  <script>
    const form = document.querySelector("#calculator-form");
    const result = document.querySelector("#result");
    const button = document.querySelector("#calculate-button");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      result.classList.remove("error");
      result.textContent = "";
      button.disabled = true;
      button.textContent = "Calculating...";

      try {
        const response = await fetch("/api/calc", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            a: Number(form.elements.a.value),
            b: Number(form.elements.b.value),
            operation: form.elements.operation.value
          })
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || "The calculation could not be completed.");
        }
        result.textContent = new Intl.NumberFormat(undefined, {
          maximumFractionDigits: 12
        }).format(data.result);
      } catch (error) {
        result.classList.add("error");
        result.textContent = error.message || "Unable to reach the calculator.";
      } finally {
        button.disabled = false;
        button.textContent = "Calculate";
      }
    });
  </script>
</body>
</html>
